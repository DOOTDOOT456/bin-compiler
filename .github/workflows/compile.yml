name: Compile sketch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile sketch (esp8266:esp8266:d1_mini)
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp8266:esp8266:d1_mini
          platforms: |
            - name: esp8266:esp8266
              source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
          sketch-paths: |
            - sketch
          libraries: '[]'
          cli-compile-flags: |
            - --export-binaries

      - name: Collect compiled .bin
        run: |
          mkdir -p dist
          found=$(find sketch -type f \( -name '*.ino.bin' -o -name '*.ino.*.bin' \) | head -n 1)
          if [ -z "$found" ]; then
            echo "No exported .bin found under sketch/ — .bin files in workspace:"
            find . -type f -name '*.bin' | head -20
            exit 1
          fi
          echo "Found: $found"
          cp "$found" dist/BlinkD1Mini.ino.d1_mini.bin

      - name: Upload .bin artifact
        uses: actions/upload-artifact@v7
        with:
          name: BlinkD1Mini
          path: dist/BlinkD1Mini.ino.d1_mini.bin
          if-no-files-found: error
          archive: false
          compression-level: 0
          retention-days: 30
